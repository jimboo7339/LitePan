# LitePan 自定义版本 Docker 镜像构建流水线（来自Trae）
# 触发方式：
#   1. push tag（如 v0.5.3-plus.1） → 构建 + 推标签镜像 + latest
#   2. push 到 feature/litepan-plus 分支 → 构建 + 推 plus-latest / {short-sha}
#   3. 手动 Actions → Run workflow → 指定分支 + 是否推送 latest
# 产物： ghcr.io/jimboo7339/litepan-x:{tag} （多平台 amd64/arm64）
name: Build & Push Docker Image

on:
  push:
    branches:
      - feature/litepan-plus
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "同时推送为 :latest 标签？"
        type: boolean
        default: false
      platforms:
        description: "目标架构（逗号分隔，可用 linux/amd64,linux/arm64,linux/arm/v7）"
        required: true
        default: "linux/amd64,linux/arm64"

# 仓库级权限：ghcr 推送需要 packages:write
permissions:
  contents: read
  packages: write
  # 若要生成 GitHub Release 再打开
  # contents: write

env:
  # 改成你的仓库对应的镜像名；ghcr.io/<Github用户名小写>/<仓库名小写>
  IMAGE_NAME: ghcr.io/jimboo7339/litepan-x
  # 与 Dockerfile / go.mod 对齐，避免 toolchain 自动升级出错
  GO_VERSION: "1.26"

jobs:
  build-and-push:
    name: Build Docker image & Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 多平台构建支持（QEMU 模拟 arm64 等）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub Container Registry（ghcr.io）
      # 使用仓库自动提供的 GITHUB_TOKEN，无需手动创建 token
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 根据触发条件计算本次要推送的 Docker 标签（来自Trae）
      # - tag push v1.2.3 → tags: v1.2.3, v1.2, v1, latest
      # - branch push feature/* → tags: latest, sha-xxxxxxx
      # - 手动触发且勾选 push_latest → 多打一个 latest
      - name: Extract Docker metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # tag push：vX.Y.Z → 三级标签 + latest
            type=semver,pattern={{version}},priority=1000
            type=semver,pattern={{major}}.{{minor}},priority=900
            type=semver,pattern={{major}},priority=800
            type=semver,pattern=latest,priority=700,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # 分支 feature/litepan-plus：latest + 短 sha（来自Trae）
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feature/litepan-plus' }},priority=600
            type=sha,prefix=sha-,format=short,priority=500
            # 手动触发且勾选：额外追加 latest
            type=raw,value=latest,enable=${{ inputs.push_latest == true }},priority=9999
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=LitePan X
            org.opencontainers.image.description=LitePan-X 自定义版（追剧转存 + 通知渠道）
            org.opencontainers.image.vendor=jimboo7339
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # 构建 + 推送
      # BuildKit 缓存：用 GitHub Actions cache，显著加速二次构建（node_modules、go mod 都能复用）
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 原生 BuildKit 缓存
          cache-from: type=gha,scope=litepan-x-build
          cache-to: type=gha,scope=litepan-x-build,mode=max
          # 传到 build 阶段，可选覆盖 BUILD_TAGS（默认 fuse 已包含在 Dockerfile）
          build-args: |
            BUILD_TAGS=fuse

      # 友好输出：告诉用户最终推了哪些标签
      - name: Summary
        run: |
          echo "## ✅ Docker 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**仓库地址**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**推送标签:**" >> $GITHUB_STEP_SUMMARY
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n')
          for t in $TAGS; do
            echo "- \`docker pull $t\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**目标架构**: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 首次使用需确认 GHCR 镜像可见性为 Public，否则 docker pull 要先 login ghcr.io" >> $GITHUB_STEP_SUMMARY
